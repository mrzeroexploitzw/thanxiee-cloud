name = "thanxiee-cloud-control-api"
main = "src/index.js"
compatibility_date = "2026-11-13"

# Create a D1 database and replace the database_id before deploying.
[[d1_databases]]
binding = "DB"
database_name = "thanxiee-cloud"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "../../database/migrations"

[vars]
APP_ENV = "development"
